# 👻 Neon tmux — only uses the 16 terminal colors, so it follows the Ghostty
# theme (light or dark, any of them) and changes the moment the theme does.
#
# Copy: just drag with the mouse. Letting go copies to the system clipboard
# (sent to Ghostty with OSC 52), so Ctrl+Shift+V / Ctrl+V pastes it anywhere.
# Double-click copies a word, triple-click a line.
# Hold Shift while dragging to use Ghostty's own selection instead.
#
# Sessions: prefix + s opens 👻 gterminal (see tmux/gterminal).
#
# Bottom bar is clickable:
#   👻 work ✎  ◀  1 🐚 bash  2 📝 nvim  ▶  ＋ ▾          🎨 ❓ │ 📂 app · 🕒 14:02
#   👻 session → gterminal · ✎ → rename the session · a window → switch to it (wheel flips through)
#   ◀ ▶ → previous / next terminal · ＋ → new terminal here
#   ▾ → bash / fish / splits / sessions / theme / tour / help menu
#   🎨 → theme picker (ktheme) · ❓ → help & tips (ktips)

# ── 🖱️ Mouse + clipboard ─────────────────────────────
set -g mouse on
set -s set-clipboard on
set -as terminal-features ',xterm-ghostty:RGB:clipboard,xterm-256color:RGB:clipboard'
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ── ⚡ Basics ────────────────────────────────────────
set -g default-terminal 'tmux-256color'
set -s escape-time 10
set -g history-limit 12000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string '👻 #S · #W'

# New windows and splits open in the current folder
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# 👻 Session picker (gterminal), ❓ help & tips (ktips) and 🎨 themes (ktheme).
# The fixed-size popups shrink to fit small windows.
set -g @k-sessions "display-popup -E -w 90% -h 85% -b rounded -d '#{pane_current_path}' ~/.local/bin/gterminal"
set -g @k-help 'display-popup -E -b rounded -w #{?#{e|>:#{client_width},79},76,100%} -h #{?#{e|>:#{client_height},38},36,100%} ~/.local/bin/ktips'
set -g @k-theme 'display-popup -E -b rounded -w #{?#{e|>:#{client_width},85},82,100%} -h #{?#{e|>:#{client_height},22},20,100%} ~/.local/bin/ktheme'
bind -N 'Sessions (gterminal)' s run -C '#{E:@k-sessions}'
bind -N 'Help & tips (ktips)'  ? run -C '#{E:@k-help}'
bind -N 'Theme (ktheme)'       T run -C '#{E:@k-theme}'
bind -N 'Rename session'       $ command-prompt -I '#S' -p ' ✎ rename session:' { rename-session -- '%%' }

# ✎ Renamed sessions keep their saved folder + last command (for gterminal):
# @k-name remembers the old name, gterminal --renamed moves the save file.
set-hook -g session-created 'set -F @k-name "#{session_name}"'
set-hook -g session-renamed { run-shell -b "~/.local/bin/gterminal --renamed #{q:@k-name} #{q:session_name}" ; set -F @k-name "#{session_name}" }
run-shell -b 'for s in $(tmux ls -F "##{session_id}"); do tmux set -t "$s" -F @k-name "##{session_name}"; done'

# ── 🖱️ Clickable bottom bar ──────────────────────────
# The buttons are control ranges 0-6 (see @k-prev, @k-buttons, status-left and
# status-right), the session name is StatusLeft.
bind -n MouseDown1StatusLeft run -C '#{E:@k-sessions}'
bind -n MouseDown1Control6 command-prompt -I '#S' -p ' ✎ rename session:' { rename-session -- '%%' }
bind -n MouseDown1Control0 new-window -c '#{pane_current_path}'
bind -n MouseDown1Control1 display-menu -T '#[align=centre] ＋ open ' -x M -y S \
    '🐚 bash'          b { new-window -c '#{pane_current_path}' bash } \
    '🐟 fish'          f { new-window -c '#{pane_current_path}' fish } \
    '' \
    '↔ split side'     h { split-window -h -c '#{pane_current_path}' } \
    '↕ split down'     v { split-window -v -c '#{pane_current_path}' } \
    '' \
    '👻 sessions'      s { run -C '#{E:@k-sessions}' } \
    '🎨 theme'         t { run -C '#{E:@k-theme}' } \
    '✎ rename session' r { command-prompt -I '#S' -p ' ✎ rename session:' { rename-session -- '%%' } } \
    '🎓 tour'          u { new-window -S -n tour ~/.local/bin/ktour } \
    '❓ help & tips'   ? { run -C '#{E:@k-help}' }
bind -n MouseDown1Control2 run -C '#{E:@k-help}'
bind -n MouseDown1Control3 run -C '#{E:@k-theme}'
bind -n MouseDown1Control4 previous-window
bind -n MouseDown1Control5 next-window

# ── 🎨 Look ──────────────────────────────────────────
# Palette names only, no #hex: "reverse" turns a color into a pill whose text is
# the theme's background, which reads well on light and dark themes alike.
set -g status-style 'bg=default,fg=default'
set -g status-left '#[fg=magenta,bold,reverse] 👻 #S #[default]#[range=control|6]#[fg=magenta] ✎ #[norange default]'
set -g status-left-length 30
set -g status-right '#[range=control|3]#[fg=yellow] 🎨 #[norange]#[range=control|2]#[fg=yellow]❓ #[norange]#[fg=brightblack]│ #[fg=cyan]📂 #{b:pane_current_path} #[fg=brightblack]· #[fg=magenta]🕒 %H:%M '
set -g status-right-length 60

# Window tabs: number, an icon for what runs in it, name. ◀ comes before the first one,
# ▶ ＋ ▾ right after the last one.
set -g @k-icon '#{?#{==:#{window_name},tour},🎓,#{?#{==:#{pane_current_command},fish},🐟,#{?#{m/r:^(bash|zsh|sh)$,#{pane_current_command}},🐚,#{?#{m/r:^(n?vim?|nano|hx|micro)$,#{pane_current_command}},📝,#{?#{m/r:^(node|npm|npx|pnpm|yarn|bun|deno)$,#{pane_current_command}},🟩,#{?#{m/r:^python,#{pane_current_command}},🐍,#{?#{m/r:^(git|lazygit|tig)$,#{pane_current_command}},🌿,#{?#{m/r:^(ssh|mosh)$,#{pane_current_command}},🔐,#{?#{m/r:^claude$,#{pane_current_command}},🤖,🔧}}}}}}}}}'
set -g @k-prev '#[range=control|4]#[fg=cyan,bold] ◀ #[norange default]'
set -g @k-buttons '#[range=control|5]#[fg=cyan,bold] ▶ #[norange]#[range=control|0]#[fg=green,bold] ＋ #[norange]#[range=control|1]#[fg=magenta]▾ #[norange]'
setw -g window-status-format '#{?window_start_flag,#{E:@k-prev},}#[dim] #I #{E:@k-icon} #W #[default]#{?window_end_flag, #{E:@k-buttons},}'
setw -g window-status-current-format '#{?window_start_flag,#{E:@k-prev},}#[fg=green,bold,reverse] #I #{E:@k-icon} #W #[default]#{?window_end_flag, #{E:@k-buttons},}'
setw -g window-status-separator ' '
setw -g window-status-current-style default
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=magenta'
set -g popup-border-style 'fg=magenta'
set -g menu-border-style 'fg=magenta'
set -g menu-selected-style 'fg=magenta,reverse'
set -g message-style 'fg=magenta,bold'
set -g mode-style 'fg=magenta,reverse'
