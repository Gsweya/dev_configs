# 👻 Neon Night tmux — same colors as the Ghostty theme
#
# Copy: just drag with the mouse. Letting go copies to the system clipboard
# (sent to Ghostty with OSC 52), so Ctrl+Shift+V / Ctrl+V pastes it anywhere.
# Double-click copies a word, triple-click a line.
# Hold Shift while dragging to use Ghostty's own selection instead.
#
# Sessions: prefix + s opens 👻 gterminal (see tmux/gterminal).

# ── 🖱️ Mouse + clipboard ─────────────────────────────
set -g mouse on
set -s set-clipboard on
set -as terminal-features ',xterm-ghostty:RGB:clipboard,xterm-256color:RGB:clipboard'
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ── ⚡ Basics ────────────────────────────────────────
set -g default-terminal 'tmux-256color'
set -s escape-time 10
set -g history-limit 12000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string '👻 #S · #W'

# New windows and splits open in the current folder
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# 👻 Session picker (gterminal)
bind s display-popup -E -w 90% -h 85% -b rounded -d '#{pane_current_path}' ~/.local/bin/gterminal

# ── 🎨 Look ──────────────────────────────────────────
set -g status-style 'bg=#1a1b26,fg=#e6dfef'
set -g status-left '#[bg=#ff8fb8,fg=#1a1b26,bold] 👻 #S #[default] '
set -g status-left-length 30
set -g status-right '#[fg=#7fe3f0]📂 #{b:pane_current_path} #[fg=#4a4560]· #[fg=#c79bff]🕒 %H:%M '
setw -g window-status-format '#[fg=#4a4560] #I #W '
setw -g window-status-current-format '#[fg=#7ee8c0,bold] #I #W '
set -g pane-border-style 'fg=#4a4560'
set -g pane-active-border-style 'fg=#c79bff'
set -g popup-border-style 'fg=#c79bff'
set -g message-style 'bg=#3b2f4f,fg=#ffffff'
set -g mode-style 'bg=#3b2f4f,fg=#ffffff'
