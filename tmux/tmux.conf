# 👻 Neon tmux — only uses the 16 terminal colors, so it follows the Ghostty
# theme (light or dark, any of them) and changes the moment the theme does.
#
# Copy: just drag with the mouse. Letting go copies to the system clipboard
# (sent to Ghostty with OSC 52), so Ctrl+Shift+V / Ctrl+V pastes it anywhere.
# Double-click copies a word, triple-click a line.
# Hold Shift while dragging to use Ghostty's own selection instead.
#
# Sessions: prefix + s opens 👻 gterminal (see tmux/gterminal).
#
# The top bar is clickable:
#   🥽 Kronikus › (👻 work) ✎  ◀  1 🐚 bash (2 📝 nvim) ▶  ＋ ▾      🎨  ❓  📂 app  (🕒 14:02)
#   👻 session → gterminal · ✎ → rename the session · a window → switch to it (wheel flips through)
#   ◀ ▶ → previous / next terminal · ＋ → new terminal here
#   ▾ → bash / fish / splits / sessions / theme / tour / help menu
#   🎨 → theme picker (ktheme) · ❓ → help & tips (ktips)
# The line under it follows the terminal you are in:
#   ❯ npm test  ✅ · ⏱ 3.4s · 🕒 14:02:11                               ▲ ▼ │ ⌨ box
#   the command or ▲ → jump to it in the scrollback (again: the one before) · ▼ → the next one
#   ⌨ box → open or close the command box (kbox)

# ── 🖱️ Mouse + clipboard ─────────────────────────────
set -g mouse on
set -s set-clipboard on
set -as terminal-features ',xterm-ghostty:RGB:clipboard,xterm-256color:RGB:clipboard'
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ── ⚡ Basics ────────────────────────────────────────
set -g default-terminal 'tmux-256color'
set -s escape-time 10
set -g history-limit 12000
# Cursor shape when a program has not asked for one (matches Ghostty's blinking bar).
# Without it tmux resets the cursor to a block. ⚙ ksettings → Cursor changes both.
set -g cursor-style blinking-bar
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string '👻 #S · #W'
# Lets 🔔 knotify tell whether Ghostty is the window in front.
set -g focus-events on

# New windows and splits open in the current folder
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# 👻 Session picker (gterminal), ❓ help & tips (ktips) and 🎨 themes (ktheme).
# The fixed-size popups shrink to fit small windows.
set -g @k-sessions "display-popup -E -w 90% -h 85% -b rounded -d '#{pane_current_path}' ~/.local/bin/gterminal"
set -g @k-help 'display-popup -E -b rounded -w #{?#{e|>:#{client_width},79},76,100%} -h #{?#{e|>:#{client_height},44},42,100%} ~/.local/bin/ktips'
set -g @k-settings 'display-popup -E -b rounded -w #{?#{e|>:#{client_width},90},86,100%} -h #{?#{e|>:#{client_height},53},52,100%} ~/.local/bin/ksettings'
set -g @k-font 'display-popup -E -b rounded -w #{?#{e|>:#{client_width},90},86,100%} -h #{?#{e|>:#{client_height},53},52,100%} ~/.local/bin/ksettings font'
set -g @k-theme 'display-popup -E -b rounded -w #{?#{e|>:#{client_width},76},72,100%} -h #{?#{e|>:#{client_height},34},32,100%} ~/.local/bin/ktheme'
bind -N 'Sessions (gterminal)' s run -C '#{E:@k-sessions}'
bind -N 'Help & tips (ktips)'  ? run -C '#{E:@k-help}'
bind -N 'Theme (ktheme)'       T run -C '#{E:@k-theme}'
bind -N 'Settings (ksettings)' S run -C '#{E:@k-settings}'
bind -N 'Command box (kbox)'   b run -b '~/.local/bin/kbox --toggle #{pane_id}'
bind -N 'Rename session'       $ command-prompt -I '#S' -p ' ✎ rename session:' { rename-session -- '%%' }

# ✎ Renamed sessions keep their saved folder + last command (for gterminal):
# @k-name remembers the old name, gterminal --renamed moves the save file.
set-hook -g session-created 'set -F @k-name "#{session_name}"'
# A ⚡ quick session that gets a name of its own is kept (saved) from then on.
set-hook -g session-renamed { run-shell -b "~/.local/bin/gterminal --renamed #{q:@k-name} #{q:session_name}" ; set -F @k-name "#{session_name}" ; set -u @k-quick }
# ⚡ Quick sessions (gterminal) end with the window that opened them.
set-hook -g client-detached 'run -b "~/.local/bin/gterminal --tidy #{q:hook_client}"'
run-shell -b 'for s in $(tmux ls -F "##{session_id}"); do tmux set -t "$s" -F @k-name "##{session_name}"; done'

# ── ⌨ Commands ─────────────────────────────────────
# Alt+i jumps between the terminal and its command box; works inside any program.
bind -n M-i run -b '~/.local/bin/kbox --jump #{pane_id}'
# ▲ ▼ and Alt+↑ ↓ walk through the commands in the scrollback, using the marks the
# Kronikus prompt leaves (OSC 133). From a live terminal ▲ goes up twice: the first
# stop would be the prompt you are sitting at. q or esc goes back. Full-screen
# programs like vim keep their Alt+↑ ↓. From the box they act on the terminal above.
set -g @k-prev '#{?@k-box,last-pane ;,} copy-mode ; send -X previous-prompt#{?pane_in_mode,, ; send -X previous-prompt}'
set -g @k-next '#{?@k-box,last-pane ;,} if -F "##{pane_in_mode}" "send -X next-prompt"'
bind -n M-Up   if -F '#{alternate_on}' { send-keys M-Up }   { run -C '#{E:@k-prev}' }
bind -n M-Down if -F '#{alternate_on}' { send-keys M-Down } { run -C '#{E:@k-next}' }
bind -T copy-mode    M-Up   send -X previous-prompt
bind -T copy-mode    M-Down send -X next-prompt
bind -T copy-mode-vi M-Up   send -X previous-prompt
bind -T copy-mode-vi M-Down send -X next-prompt
# A tab keeps the name of its terminal while you type in its box.
setw -g automatic-rename-format '#{?@k-box,#{P:#{?#{&&:#{==:#{@k-box},},#{pane_last}},#{pane_current_command},}},#{?pane_in_mode,[tmux],#{pane_current_command}}}#{?pane_dead,[dead],}'
# A box left alone in a window goes with its terminal.
set-hook -g pane-exited     'run -b "~/.local/bin/kbox --tidy"'
set-hook -g after-kill-pane 'run -b "~/.local/bin/kbox --tidy"'
# 🔔 knotify puts ✅ or ❌ on a tab whose command finished; opening the tab clears it.
set-hook -g session-window-changed 'set -wu @k-done'

# ── 🖱️ Clickable top bar ─────────────────────────────
# The buttons are control ranges 0-9 (see @k-buttons, @k-line2, status-left and status-right),
# the session name is StatusLeft.
bind -n MouseDown1StatusLeft run -C '#{E:@k-sessions}'
# Tabs switch on click as usual; your avatar (user range "settings") opens ⚙ settings.
bind -n MouseDown1Status if -F '#{==:#{mouse_status_range},settings}' { run -C '#{E:@k-settings}' } { switch-client -t = }
bind -n MouseDown1Control6 command-prompt -I '#S' -p ' ✎ rename session:' { rename-session -- '%%' }
bind -n MouseDown1Control0 new-window -c '#{pane_current_path}'
bind -n MouseDown1Control1 display-menu -T '#[align=centre] ＋ open ' -x M -y S \
    '🐚 bash'          b { new-window -c '#{pane_current_path}' bash } \
    '🐟 fish'          f { new-window -c '#{pane_current_path}' fish } \
    '' \
    '↔ split side'     h { split-window -h -c '#{pane_current_path}' } \
    '↕ split down'     v { split-window -v -c '#{pane_current_path}' } \
    '' \
    '👻 sessions'      s { run -C '#{E:@k-sessions}' } \
    '🎨 theme'         t { run -C '#{E:@k-theme}' } \
    '⚙ settings'       S { run -C '#{E:@k-settings}' } \
    '🔤 font'          o { run -C '#{E:@k-font}' } \
    '⌨ command box'    k { run -b '~/.local/bin/kbox --toggle #{pane_id}' } \
    '✎ rename session' r { command-prompt -I '#S' -p ' ✎ rename session:' { rename-session -- '%%' } } \
    '🎓 tour'          u { new-window -S -n tour ~/.local/bin/ktour } \
    '❓ help & tips'   ? { run -C '#{E:@k-help}' }
bind -n MouseDown1Control2 run -C '#{E:@k-help}'
bind -n MouseDown1Control3 run -C '#{E:@k-theme}'
# Right-click a tab: switch to it, then its menu (tmux's own only opens for the current tab).
bind -n MouseDown3Status {
    select-window -t =
    display-menu -T '#[align=centre] #{window_index} #{window_name} ' -x W -y W \
        '✎ rename'    n { command-prompt -I '#W' -p ' ✎ rename window:' { rename-window -- '%%' } } \
        '◀ move left'  l { swap-window -d -t :-1 } \
        '▶ move right' r { swap-window -d -t :+1 } \
        '' \
        '＋ new after' w { new-window -a -c '#{pane_current_path}' } \
        '✕ close'     X { kill-window }
}
bind -n MouseDown1Control4 previous-window
bind -n MouseDown1Control5 next-window
# As keys: a send -X from a mouse binding would first move the cursor to the click, up here in the bar.
bind -n MouseDown1Control7 send-keys -K M-Up
bind -n MouseDown1Control8 send-keys -K M-Down
bind -n MouseDown1Control9 run -b '~/.local/bin/kbox --toggle #{pane_id}'

# ── 🎨 Look ──────────────────────────────────────────
# The bar sits on top like browser tabs, with the latest command in a line under it.
# (⚙ ksettings moves it to the bottom and turns the latest command off.)
set -g status-position top
set -g status 2
# Only what the prompt saved for this pane, cut to fit; the buttons stay at the right.
# In the command box it shows the terminal the box serves (the last pane you were in).
set -g @k-cmd '#[range=control|7]#{?@k-last,#[fg=magenta]#[bold]❯#[default] #{=/#{e|-:#{client_width},58}/…:@k-last},#[fg=brightblack]❯ no command yet}#[norange default] #{@k-last-info}'
set -g @k-line2 ' #{?@k-box,#{P:#{?pane_last,#{E:@k-cmd},}},#{E:@k-cmd}}#[align=right]#[range=control|7]#[fg=brightblack] ▲ #[norange default]#[range=control|8]#[fg=brightblack]▼ #[norange default]#[fg=brightblack]│#[default]#[range=control|9]#[fg=magenta] #{@k-i-box} #[norange default] '
set -g status-format[1] '#{E:@k-line2}'

# Palette names only, no #hex, used the way Monkeytype uses its colors: magenta is the
# theme's one accent (main) and only marks what is active, brightblack is the quiet
# color (sub) for everything else, and black is a surface just off the background
# (subAlt) that the active items sit on as flat chips.
#   round the pills off, and   are the powerline arrows (Nerd Font glyphs, built into Ghostty).
set -g status-style 'bg=default,fg=default'
# You first: the Kronikus avatar + name (the prompt sets @k-avatar / @k-user from
# KRONIKUS_AVATAR / KRONIKUS_NAME; tmux can't draw the picture, so it's the emoji).
# The name hides on windows under 120 columns; clicking it opens ⚙ settings.
if -F '#{==:#{@k-avatar},}' 'set -g @k-avatar 🥽'
if -F '#{==:#{@k-user},}' 'set -g @k-user Kronikus'
set -g @k-av '#[range=user|settings]#[fg=magenta,bold]#{@k-avatar}#{?#{e|>:#{client_width},120}, #{=/16/…:@k-user},}#[norange default]'
# The session: ⚡ for a quick one (gterminal); long names are cut so ✎ and ◀ always fit.
set -g @k-ses '#{?@k-quick,#{@k-i-quick},#{@k-i-session}}#{=/24/…:session_name}'

# ── 🖌 Skins and icons ───────────────────────────────
# ⚙ ksettings → Skin / Icons saves your pick as @k-skin / @k-icons in
# ~/.config/kronikus/tmux.conf, together with the bar position, the latest command
# and the cursor. It's read here so the skins below know it, and ksettings sources
# this whole file again when you change one.
set -g @k-skin neon
set -g @k-icons emoji
source -q ~/.config/kronikus/tmux.conf

# Icons: emoji, nerd (Nerd Font glyphs, the Omarchy look) or text (no pictures at all).
# @k-icon is what runs in a window, with a space after it (nothing at all for text).
set -g @k-icon-emoji '#{?#{==:#{window_name},tour},🎓,#{?#{==:#{pane_current_command},kbox},⌨️,#{?#{==:#{pane_current_command},fish},🐟,#{?#{m/r:^(bash|zsh|sh)$,#{pane_current_command}},🐚,#{?#{m/r:^(n?vim?|nano|hx|micro)$,#{pane_current_command}},📝,#{?#{m/r:^(node|npm|npx|pnpm|yarn|bun|deno)$,#{pane_current_command}},🟩,#{?#{m/r:^python,#{pane_current_command}},🐍,#{?#{m/r:^(git|lazygit|tig)$,#{pane_current_command}},🌿,#{?#{m/r:^(ssh|mosh)$,#{pane_current_command}},🔐,#{?#{m/r:^claude$,#{pane_current_command}},🤖,🔧}}}}}}}}}}'
set -g @k-icon-nerd '#{?#{==:#{window_name},tour},󰑴,#{?#{==:#{pane_current_command},kbox},,#{?#{==:#{pane_current_command},fish},󰈺,#{?#{m/r:^(bash|zsh|sh)$,#{pane_current_command}},,#{?#{m/r:^(n?vim?|nano|hx|micro)$,#{pane_current_command}},,#{?#{m/r:^(node|npm|npx|pnpm|yarn|bun|deno)$,#{pane_current_command}},,#{?#{m/r:^python,#{pane_current_command}},,#{?#{m/r:^(git|lazygit|tig)$,#{pane_current_command}},,#{?#{m/r:^(ssh|mosh)$,#{pane_current_command}},󰣀,#{?#{m/r:^claude$,#{pane_current_command}},󰚩,}}}}}}}}}}'
if -F '#{==:#{@k-icons},nerd}' {
    set -g @k-icon '#{E:@k-icon-nerd} '
    set -g @k-i-session '󰊠 '
    set -g @k-i-quick ' '
    set -g @k-i-edit ''
    set -g @k-i-prev ''
    set -g @k-i-next ''
    set -g @k-i-new ''
    set -g @k-i-menu ''
    set -g @k-i-theme '󰏘'
    set -g @k-i-help ''
    set -g @k-i-folder ' '
    set -g @k-i-clock ' '
    set -g @k-i-box ' box'
} {
    if -F '#{==:#{@k-icons},text}' {
        set -g @k-icon ''
        set -g @k-i-session ''
        set -g @k-i-quick '~'
        set -g @k-i-edit '✎'
        set -g @k-i-prev '◀'
        set -g @k-i-next '▶'
        set -g @k-i-new '+'
        set -g @k-i-menu '▾'
        set -g @k-i-theme '◐'
        set -g @k-i-help '?'
        set -g @k-i-folder ''
        set -g @k-i-clock ''
        set -g @k-i-box 'box'
    } {
        set -g @k-icon '#{E:@k-icon-emoji} '
        set -g @k-i-session '👻 '
        set -g @k-i-quick '⚡ '
        set -g @k-i-edit '✎'
        set -g @k-i-prev '◀'
        set -g @k-i-next '▶'
        set -g @k-i-new '＋'
        set -g @k-i-menu '▾'
        set -g @k-i-theme '🎨'
        set -g @k-i-help '❓'
        set -g @k-i-folder '📂 '
        set -g @k-i-clock '🕒 '
        set -g @k-i-box '⌨ box'
    }
}

# Every skin has the same buttons in the same order; only the look changes:
# avatar (user range "settings") → ⚙ settings, session (StatusLeft) → gterminal, ✎ (6),
# ◀ (4) at the end of status-left so every tab keeps a single click zone, the tabs,
# then @k-buttons right after the last one: ▶ (5), ＋ (0), ▾ (1). 🎨 (3) and ❓ (2) on the right.
# The 📂 folder only shows on windows over 140 columns, so the tabs and buttons keep room.

# 👻 neon (the default): flat rounded chips for what's active, the other tabs as wide
# as a chip so nothing moves when you switch. A finished command's ✅ or ❌ goes in
# the two spaces a pill's round edges take.
set -g status-left ' #{E:@k-av} #[fg=brightblack]›#[default] #[range=left]#[fg=black]#[bg=black,fg=magenta,bold] #{E:@k-ses} #[default]#[fg=black]#[default]#[range=control|6]#[fg=brightblack] #{@k-i-edit} #[norange default] #[fg=brightblack]│#[default] #[range=control|4]#[fg=black]#[bg=black,fg=brightblack]#{@k-i-prev}#[default]#[fg=black]#[norange default] '
set -g status-right '#[range=control|3] #{@k-i-theme} #[norange]#[range=control|2] #{@k-i-help} #[norange] #[fg=brightblack]│#[default] #{?#{e|>:#{client_width},140},#[fg=brightblack]#{@k-i-folder}#{b:pane_current_path}  ,}#[fg=black]#[bg=black,fg=brightblack] #{@k-i-clock}%H:%M #[default]#[fg=black] '
set -g @k-buttons '#[range=control|5]#[fg=black]#[bg=black,fg=brightblack]#{@k-i-next}#[default]#[fg=black]#[norange default] #[fg=brightblack]│#[default]#[range=control|0]#[fg=brightblack] #{@k-i-new} #[norange]#[range=control|1]#[fg=brightblack]#{@k-i-menu} #[norange]'
setw -g window-status-format '#[fg=brightblack]#{?@k-done,#{@k-done},  }#I #{E:@k-icon}#{=/14/…:window_name}  #[default]#{?window_end_flag, #{E:@k-buttons},}'
setw -g window-status-current-format '#[fg=black]#[bg=black,fg=magenta,bold] #I #{E:@k-icon}#{=/14/…:window_name} #[default]#[fg=black]#[default]#{?window_end_flag, #{E:@k-buttons},}'
set -g pane-active-border-style 'fg=brightblack'
set -g pane-border-lines single

#  omarchy: like Omarchy's tmux. The session is a solid block in the accent, tabs are
# plain "1:name" with the current one in the accent, the modes tmux is in (COPY, PREFIX,
# ZOOM) on the right, your avatar at the far right, and the active split's border lit.
# Looks best with Icons → nerd.
if -F '#{==:#{@k-skin},omarchy}' {
    set -g status-left '#[range=left]#[bg=magenta,fg=black,bold] #{E:@k-ses} #[norange default]#[range=control|6]#[fg=brightblack] #{@k-i-edit} #[norange default]#[range=control|4]#[fg=brightblack]#{@k-i-prev} #[norange default]'
    set -g status-right '#[fg=magenta,bold]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[default]#[range=control|3]#[fg=brightblack] #{@k-i-theme} #[norange]#[range=control|2]#[fg=brightblack]#{@k-i-help} #[norange default]#{?#{e|>:#{client_width},140},#[fg=brightblack] #{@k-i-folder}#{b:pane_current_path},}#[fg=brightblack]  #{@k-i-clock}%H:%M #[default]#[range=user|settings]#[fg=magenta,bold]#{@k-avatar} #[norange default]'
    set -g @k-buttons '#[range=control|5]#[fg=brightblack]#{@k-i-next} #[norange default]#[range=control|0]#[fg=brightblack] #{@k-i-new} #[norange]#[range=control|1]#[fg=brightblack]#{@k-i-menu} #[norange default]'
    setw -g window-status-format '#[fg=brightblack] #{?@k-done,#{@k-done} ,}#I:#{E:@k-icon}#{=/14/…:window_name} #[default]#{?window_end_flag,#{E:@k-buttons},}'
    setw -g window-status-current-format '#[fg=magenta,bold] #I:#{E:@k-icon}#{=/14/…:window_name} #[default]#{?window_end_flag,#{E:@k-buttons},}'
    set -g pane-active-border-style 'fg=magenta'
}

#  powerline: you and the session as arrow segments, the current tab and the clock as
# accent arrows.
if -F '#{==:#{@k-skin},powerline}' {
    set -g status-left '#[range=user|settings]#[bg=magenta,fg=black,bold] #{@k-avatar}#{?#{e|>:#{client_width},120}, #{=/16/…:@k-user},} #[norange]#[range=left]#[fg=magenta,bg=black]#[fg=magenta,bold] #{E:@k-ses} #[norange default]#[fg=black]#[default]#[range=control|6]#[fg=brightblack] #{@k-i-edit} #[norange default]#[range=control|4]#[fg=brightblack]#{@k-i-prev} #[norange default]'
    set -g status-right '#[range=control|3]#[fg=brightblack] #{@k-i-theme} #[norange]#[range=control|2]#[fg=brightblack]#{@k-i-help} #[norange default]#{?#{e|>:#{client_width},140},#[fg=black]#[bg=black]#[fg=brightblack] #{@k-i-folder}#{b:pane_current_path} #[fg=magenta],#[fg=magenta]}#[bg=magenta,fg=black,bold] #{@k-i-clock}%H:%M #[default]'
    set -g @k-buttons '#[range=control|5]#[fg=brightblack] #{@k-i-next} #[norange default]#[range=control|0]#[fg=brightblack] #{@k-i-new} #[norange]#[range=control|1]#[fg=brightblack]#{@k-i-menu} #[norange default]'
    setw -g window-status-format '#[fg=brightblack]#{?@k-done,#{@k-done},  }#I #{E:@k-icon}#{=/14/…:window_name}  #[default]#{?window_end_flag,#{E:@k-buttons},}'
    setw -g window-status-current-format '#[fg=magenta]#[bg=magenta,fg=black,bold] #I #{E:@k-icon}#{=/14/…:window_name} #[default]#[fg=magenta]#[default]#{?window_end_flag,#{E:@k-buttons},}'
}

# 🫧 bubbles: every tab and button a pill; the current tab, the session and the clock
# are filled with the accent.
if -F '#{==:#{@k-skin},bubbles}' {
    set -g status-left ' #{E:@k-av} #[range=left]#[fg=magenta]#[bg=magenta,fg=black,bold] #{E:@k-ses} #[default]#[fg=magenta]#[norange default]#[range=control|6]#[fg=brightblack] #{@k-i-edit} #[norange default] #[range=control|4]#[fg=black]#[bg=black,fg=brightblack]#{@k-i-prev}#[default]#[fg=black]#[norange default] '
    set -g status-right '#[range=control|3]#[fg=black]#[bg=black,fg=brightblack]#{@k-i-theme}#[default]#[fg=black]#[norange] #[range=control|2]#[fg=black]#[bg=black,fg=brightblack]#{@k-i-help}#[default]#[fg=black]#[norange default] #{?#{e|>:#{client_width},140},#[fg=brightblack]#{@k-i-folder}#{b:pane_current_path} ,}#[fg=magenta]#[bg=magenta,fg=black,bold]#{@k-i-clock}%H:%M#[default]#[fg=magenta]#[default] '
    set -g @k-buttons '#[range=control|5]#[fg=black]#[bg=black,fg=brightblack]#{@k-i-next}#[default]#[fg=black]#[norange default] #[range=control|0]#[fg=black]#[bg=black,fg=brightblack]#{@k-i-new}#[default]#[fg=black]#[norange] #[range=control|1]#[fg=black]#[bg=black,fg=brightblack]#{@k-i-menu}#[default]#[fg=black]#[norange default]'
    setw -g window-status-format '#[fg=black]#[bg=black,fg=brightblack]#{?@k-done,#{@k-done}, }#I #{E:@k-icon}#{=/14/…:window_name} #[default]#[fg=black]#[default] #{?window_end_flag,#{E:@k-buttons},}'
    setw -g window-status-current-format '#[fg=magenta]#[bg=magenta,fg=black,bold] #I #{E:@k-icon}#{=/14/…:window_name} #[default]#[fg=magenta]#[default] #{?window_end_flag,#{E:@k-buttons},}'
}

# ▫ minimal: words only, no chips. The current tab is in the accent, its name underlined.
if -F '#{==:#{@k-skin},minimal}' {
    set -g status-left ' #{E:@k-av}  #[range=left]#[fg=magenta,bold]#{E:@k-ses}#[norange default]#[range=control|6]#[fg=brightblack] #{@k-i-edit} #[norange default] #[range=control|4]#[fg=brightblack]#{@k-i-prev}#[norange default] '
    set -g status-right '#[range=control|3]#[fg=brightblack]#{@k-i-theme}#[norange]  #[range=control|2]#[fg=brightblack]#{@k-i-help}#[norange default]  #[fg=brightblack]#{?#{e|>:#{client_width},140},#{b:pane_current_path} · ,}%H:%M#[default] '
    set -g @k-buttons ' #[range=control|5]#[fg=brightblack]#{@k-i-next}#[norange default]  #[range=control|0]#[fg=brightblack]#{@k-i-new}#[norange] #[range=control|1]#[fg=brightblack]#{@k-i-menu}#[norange default]'
    setw -g window-status-format '#[fg=brightblack] #{?@k-done,#{@k-done} ,}#I #{E:@k-icon}#{=/14/…:window_name} #[default]#{?window_end_flag,#{E:@k-buttons},}'
    setw -g window-status-current-format '#[fg=magenta,bold] #I #{E:@k-icon}#[underscore]#{=/14/…:window_name}#[nounderscore] #[default]#{?window_end_flag,#{E:@k-buttons},}'
}

# [ ] retro: square brackets around what's active, like an old text-mode screen,
# and plain ASCII lines between the splits.
if -F '#{==:#{@k-skin},retro}' {
    set -g status-left ' #{E:@k-av} #[range=left]#[fg=magenta,bold][#{E:@k-ses}]#[norange default]#[range=control|6]#[fg=brightblack] #{@k-i-edit} #[norange default]#[range=control|4]#[fg=brightblack][#{@k-i-prev}]#[norange default] '
    set -g status-right '#[range=control|3]#[fg=brightblack][#{@k-i-theme}]#[norange]#[range=control|2]#[fg=brightblack][#{@k-i-help}]#[norange default] #{?#{e|>:#{client_width},140},#[fg=brightblack][#{@k-i-folder}#{b:pane_current_path}] ,}#[fg=magenta,bold][#{@k-i-clock}%H:%M]#[default] '
    set -g @k-buttons ' #[range=control|5]#[fg=brightblack][#{@k-i-next}]#[norange default] #[range=control|0]#[fg=brightblack][#{@k-i-new}]#[norange]#[range=control|1]#[fg=brightblack][#{@k-i-menu}]#[norange default]'
    setw -g window-status-format '#[fg=brightblack] #I:#{E:@k-icon}#{=/14/…:window_name}#{?@k-done,#{@k-done},} #[default]#{?window_end_flag,#{E:@k-buttons},}'
    setw -g window-status-current-format '#[fg=magenta,bold][#I:#{E:@k-icon}#{=/14/…:window_name}]#[default]#{?window_end_flag,#{E:@k-buttons},}'
    set -g pane-border-lines simple
}
set -g status-left-length 75
set -g status-right-length 70
setw -g window-status-separator ''
setw -g window-status-current-style default
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=brightblack'
# The theme's own background: tmux 3.8 would use a fixed grey for popups.
set -g popup-style 'bg=default'
set -g popup-border-style 'fg=brightblack'
set -g menu-border-style 'fg=brightblack'
set -g menu-selected-style 'fg=magenta,reverse'
set -g message-style 'fg=magenta,bold'
set -g mode-style 'fg=magenta,reverse'
set -g copy-mode-match-style 'fg=yellow,reverse'
set -g copy-mode-current-match-style 'fg=green,reverse'

